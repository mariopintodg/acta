<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Acta</title>
<meta name="description" content="Graba tus reuniones y conviértelas en actas visuales: transcripción con hablantes, decisiones, tareas, mapa mental, informe y brief del proyecto.">
<meta name="theme-color" content="#07080D">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acta">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="brand" data-nav="library" aria-label="Ir a la biblioteca">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg></span>
      <span class="brand-name">Acta</span>
    </button>
    <div class="search" id="top-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar en todo: lo que se dijo, tareas, personas…" aria-label="Buscar reuniones" autocomplete="off">
    </div>
    <nav class="top-nav" aria-label="Principal">
      <button class="btn ghost" data-nav="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M13 7h7M13 17h7"/></svg><span>Compromisos</span></button>
      <button class="btn ghost" data-nav="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg><span>Importar</span></button>
      <button class="btn ghost" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Ajustes</span></button>
      <button class="btn rec-btn" data-nav="record"><span class="rec-dot" aria-hidden="true"></span><span>Grabar</span></button>
    </nav>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<nav class="dock" aria-label="Navegación">
  <button data-nav="library" class="dock-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Inicio</span></button>
  <button data-nav="import" class="dock-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg><span>Importar</span></button>
  <button data-nav="record" class="dock-rec" aria-label="Grabar reunión"><span></span></button>
  <button data-nav="tasks" class="dock-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M13 7h7M13 17h7"/></svg><span>Compromisos</span></button>
  <button data-nav="settings" class="dock-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Ajustes</span></button>
</nav>

<div class="pocket" id="pocket" hidden>
  <div class="pocket-in">
    <span class="pocket-state"><i></i><span id="pocket-state">Grabando</span></span>
    <div class="pocket-time" id="pocket-time">00:00</div>
    <div class="pocket-lvl" aria-hidden="true"><i id="pocket-lvl"></i></div>
    <button class="pocket-hold" id="pocket-hold" aria-label="Mantén presionado para salir del modo bolsillo">
      <svg class="pr" viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="46"/><circle class="p" cx="50" cy="50" r="46"/></svg>
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </button>
    <small>Mantén presionado el candado para salir</small>
  </div>
</div>

<div class="lock" id="lock" hidden></div>
<div class="netpill" id="netpill" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 4-2.6M9.5 5.2A15 15 0 0 1 22 8.5M5 12a10 10 0 0 1 3.4-2M12.6 9.1A10 10 0 0 1 19 12M8.5 15.5a5 5 0 0 1 7 0M12 19h.01M3 3l18 18"/></svg>Sin conexión · puedes grabar igual</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js" defer></script>
</body>
</html>
