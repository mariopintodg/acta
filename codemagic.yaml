# Compilación de Acta para iPhone en Codemagic (Mac en la nube).
# Firma automática de Apple con la clave de App Store Connect (no necesita clave de certificado).
# Variables secretas en el grupo "acta_appstore" de la app en Codemagic (Environment variables):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenido completo del archivo .p8) y APPLE_TEAM_ID.
# Nada de esto se guarda en el repositorio.

workflows:
  acta-ios-prueba:
    name: Acta iOS · prueba (sin firmar)
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: App web dentro del proyecto nativo
        script: |
          npm ci
          npm run build:www
          npx cap sync ios
      - name: Compilar para el simulador
        script: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -60

  acta-ios-testflight:
    name: Acta iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      groups:
        - acta_appstore
      vars:
        BUNDLE_ID: cl.mariopinto.acta
    scripts:
      - name: App web dentro del proyecto nativo
        script: |
          npm ci
          npm run build:www
          npx cap sync ios
      - name: Clave de App Store Connect
        script: |
          mkdir -p /tmp/asc
          # Rearma el .p8 aunque se haya pegado con saltos de línea de Windows, espacios o en una sola línea
          python3 - <<'PY'
          import os, re, textwrap, base64
          raw = os.environ.get("ASC_KEY_P8", "")
          body = re.sub(r"-----(BEGIN|END)[^-]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          if not body:
              raise SystemExit("Falta ASC_KEY_P8 en el grupo acta_appstore")
          base64.b64decode(body)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open("/tmp/asc/AuthKey.p8", "w").write(pem)
          print("Clave P8 lista (" + str(len(body)) + " caracteres)")
          PY
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]'); ISSUER=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "ASC_KEY_ID_CLEAN=$KEY_ID" >> $CM_ENV
          echo "ASC_ISSUER_ID_CLEAN=$ISSUER" >> $CM_ENV
          echo "Key ID: ${#KEY_ID} caracteres · Issuer ID: ${#ISSUER} caracteres"
      - name: Archivar y firmar (firma automática de Apple)
        script: |
          set -o pipefail
          BUILD=$(date -u +%y%m%d%H%M)
          AUTH="-allowProvisioningUpdates -authenticationKeyPath /tmp/asc/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID_CLEAN -authenticationKeyIssuerID $ASC_ISSUER_ID_CLEAN"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Acta.xcarchive archive \
            DEVELOPMENT_TEAM=$(printf %s "$APPLE_TEAM_ID" | tr -d "[:space:]") CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            CURRENT_PROJECT_VERSION=$BUILD $AUTH | tail -80
      - name: Subir a App Store Connect (TestFlight)
        script: |
          set -o pipefail
          cat > /tmp/asc/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' /tmp/asc/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Acta.xcarchive -exportPath build/ipa \
            -exportOptionsPlist /tmp/asc/ExportOptions.plist \
            -allowProvisioningUpdates -authenticationKeyPath /tmp/asc/AuthKey.p8 \
            -authenticationKeyID $ASC_KEY_ID_CLEAN -authenticationKeyIssuerID $ASC_ISSUER_ID_CLEAN | tail -60
      - name: Borrar la clave
        script: rm -rf /tmp/asc
    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - mariopintodg2023@gmail.com
        notify:
          success: true
          failure: true
