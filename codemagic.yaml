# Compilación de Acta para iPhone en Codemagic (Mac en la nube).
# Firma automática de Apple con la clave de App Store Connect (no necesita clave de certificado).
# Variables secretas en el grupo "acta_appstore" de la app en Codemagic (Environment variables):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenido completo del archivo .p8) y APPLE_TEAM_ID.
# Nada de esto se guarda en el repositorio.

workflows:
  acta-ios-prueba:
    name: Acta iOS · prueba (sin firmar)
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: App web dentro del proyecto nativo
        script: |
          npm ci
          npm run build:www
          npx cap sync ios
      - name: Compilar para el simulador
        script: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -60

  acta-ios-testflight:
    name: Acta iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      groups:
        - acta_appstore
      vars:
        BUNDLE_ID: cl.mariopinto.acta
    scripts:
      - name: App web dentro del proyecto nativo
        script: |
          npm ci
          npm run build:www
          npx cap sync ios
      - name: Clave de App Store Connect
        script: |
          mkdir -p /tmp/asc
          printf '%s\n' "$ASC_KEY_P8" > /tmp/asc/AuthKey.p8
          test -s /tmp/asc/AuthKey.p8 || { echo "Falta ASC_KEY_P8 en el grupo acta_appstore"; exit 1; }
      - name: Archivar y firmar (firma automática de Apple)
        script: |
          set -o pipefail
          BUILD=$(date -u +%y%m%d%H%M)
          AUTH="-allowProvisioningUpdates -authenticationKeyPath /tmp/asc/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Acta.xcarchive archive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            CURRENT_PROJECT_VERSION=$BUILD $AUTH | tail -80
      - name: Subir a App Store Connect (TestFlight)
        script: |
          set -o pipefail
          cat > /tmp/asc/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' /tmp/asc/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Acta.xcarchive -exportPath build/ipa \
            -exportOptionsPlist /tmp/asc/ExportOptions.plist \
            -allowProvisioningUpdates -authenticationKeyPath /tmp/asc/AuthKey.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID | tail -60
      - name: Borrar la clave
        script: rm -rf /tmp/asc
    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - mariopintodg2023@gmail.com
        notify:
          success: true
          failure: true
